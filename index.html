<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo_180x180.svg" />

    <!-- Mobile / Browser -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#008100" />

    <!-- SEO -->
    <title>HiveMarket | Discover Local Shops, Products & Services</title>

    <meta
      name="description"
      content="Discover local shops, products, and services with HiveMarket. Explore businesses around you, connect with sellers, and find what you need before you visit."
    />

    <meta
      name="keywords"
      content="HiveMarket, local marketplace, shops near me, local businesses, products, services, Nigeria marketplace, discover shops"
    />

    <meta name="author" content="HiveMarket" />

    <!-- Search Engine -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.hivemarket.ng/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HiveMarket" />
    <meta
      property="og:title"
      content="HiveMarket | Discover Local Shops, Products & Services"
    />
    <meta
      property="og:description"
      content="Discover local shops, products, and services. Explore businesses, connect with sellers, and find what you need before you visit."
    />
    <meta property="og:url" content="https://www.hivemarket.ng/" />
    <meta
      property="og:image"
      content="https://www.hivemarket.ng/logo_180x180.svg"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="HiveMarket | Discover Local Shops, Products & Services"
    />
    <meta
      name="twitter:description"
      content="Discover local shops, products, and services with HiveMarket."
    />
    <meta
      name="twitter:image"
      content="https://www.hivemarket.ng/logo_180x180.svg"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
